<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII Ring</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.h{position:fixed;font:11px/1.7 ui-monospace,Menlo,Consolas,monospace;color:#8c8c8c;white-space:pre;pointer-events:none}
#tl{right:18px;top:12px;color:#d0d0d0}
#bl{left:24px;bottom:20px}
.d{color:#f33}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="h" id="tl"></div>
<div class="h" id="bl"></div>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d'),tl=document.getElementById('tl'),bl=document.getElementById('bl');
const RAMP=" .'`,:;-~+=*x#%@",RL=RAMP.length-1,TAU=Math.PI*2,TILT=.22,D=4;
const LV=[];for(let i=0;i<=24;i++)LV.push(`rgba(232,236,244,${(i/24).toFixed(2)})`);
let W,H,fs,cw,ch,cols,rows,U,N,Z,B,K,Rf,stars=[];

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  fs=Math.max(7,Math.round(Math.min(W,H)/70));cw=fs*.6;ch=fs;
  cols=Math.ceil(W/cw);rows=Math.ceil(H/ch);U=Math.min(W,H*1.05)*.29;N=cols*rows;
  Z=new Float32Array(N);B=new Float32Array(N);K=new Uint8Array(N);Rf=new Float32Array(N);
  g.font=fs+'px ui-monospace,Menlo,Consolas,monospace';g.textBaseline='top';
  stars=[];for(let i=0,n=N/90|0;i<n;i++)stars.push([Math.random()*cols|0,Math.random()*rows|0,Math.random()*TAU,.5+Math.random()*2,Math.random()<.2?'+':'.']);
}
addEventListener('resize',resize);resize();

/* ---------- geometry: [x,y,z,nx,ny,nz,kind] kind 0 band, 1 prong, 2 diamond, 3 orbit ---------- */
const G=[];
function add(x,y,z,nx,ny,nz,k){const l=Math.hypot(nx,ny,nz)||1;G.push(x,y,z,nx/l,ny/l,nz/l,k)}
const A=.55,BH=.82,CY=-.12;
for(let i=0;i<1000;i++){
  const t=i/1000*TAU,ct=Math.cos(t),st=Math.sin(t);
  let nx=ct/A,ny=st/BH;const l=Math.hypot(nx,ny);nx/=l;ny/=l;
  const ex=A*ct,ey=BH*st+CY,th=.055+.02*Math.max(0,st);
  for(let j=0;j<30;j++){
    const p=j/30*TAU,cp=Math.cos(p),sp=Math.sin(p);
    const c2=Math.sign(cp)*Math.pow(Math.abs(cp),.75),s2=Math.sign(sp)*Math.pow(Math.abs(sp),.75);
    add(ex+nx*th*c2,ey+ny*th*c2,.115*s2,nx*cp,ny*cp,sp*1.2,0);
  }
}
for(let q=0;q<4;q++){
  const f=Math.PI/4+q*Math.PI/2,cf=Math.cos(f),sf=Math.sin(f);
  for(let s=0;s<=60;s++){
    const u=.2+.8*s/60,r=.06+.2*Math.pow(u,1.5),y=.66+.32*u;
    for(let m=0;m<8;m++){
      const a=m/8*TAU,ox=Math.cos(a)*.024,oy=Math.sin(a)*.024;
      const dx=cf*ox-sf*oy,dz=sf*ox+cf*oy;
      add(cf*r+dx,y,sf*r+dz,dx,0,dz,1);
    }
  }
}
const Y0=.70,YG=.93,YT=1.08,RG=.22,RT=.125,M=8,SEC=TAU/M;
function facet(ang,rr,y,type){
  const fa=(Math.floor(ang/SEC)+.5)*SEC,rp=rr*Math.cos(SEC/2)/Math.cos(ang-fa),c=Math.cos(fa),s=Math.sin(fa);
  type?add(Math.cos(ang)*rp,y,Math.sin(ang)*rp,c*.8,-.6,s*.8,2):add(Math.cos(ang)*rp,y,Math.sin(ang)*rp,c*.62,.78,s*.62,2);
}
for(let ai=0;ai<240;ai++){
  const ang=(ai+.5)/240*TAU;
  for(let h=0;h<=16;h++){const u=h/16;facet(ang,RT+(RG-RT)*u,YT-(YT-YG)*u,0)}
  for(let h=0;h<=22;h++){const u=h/22;facet(ang,RG*(1-u),YG-(YG-Y0)*u,1)}
}
for(let r=0;r<14;r++)for(let a=0;a<80;a++){const rr=RT*r/13,aa=a/80*TAU;add(Math.cos(aa)*rr,YT,Math.sin(aa)*rr,0,1,0,2)}
for(let o=0;o<2;o++)for(let i=0;i<260;i++){
  const a=i/260*TAU,s=o?-1:1,r=1.15+Math.random()*.03,th=s*.6;
  const x=r*Math.cos(a),y=.35*r*Math.sin(a);
  add(x*Math.cos(th)-y*Math.sin(th),x*Math.sin(th)+y*Math.cos(th)+.2,.6*s*Math.sin(a),0,0,0,3);
}
const P=new Float32Array(G),NP=P.length/7;

/* ---------- lighting ---------- */
const LL=Math.hypot(-.45,.65,.62),Lx=-.45/LL,Ly=.65/LL,Lz=.62/LL;
const Hl=Math.hypot(Lx,Ly,Lz+1),Hx=Lx/Hl,Hy=Ly/Hl,Hz=(Lz+1)/Hl;

/* ---------- sparkles ---------- */
const glints=[];let glintTotal=0,letters=0;
function put(c,r,ch,a){
  if(c<0||r<0||c>=cols||r>=rows||a<=.04)return;
  g.fillStyle=LV[Math.min(24,a*24|0)];g.fillText(ch,c*cw,r*ch);letters++;
}
function star(c,r,len,a,thin){
  put(c,r,'*',a);
  for(let d=1;d<=len;d++){
    const f=a*(1-d/(len+1)),dx=Math.round(d*1.7);
    put(c,r-d,'|',f);put(c,r+d,'|',f*.8);
    put(c-dx*(thin?1:1.4)|0,r,'-',f);put(c+dx*(thin?1:1.4)|0,r,'-',f);
    if(!thin&&d<len*.6){put(c+dx,r-d,'/',f*.7);put(c-dx,r+d,'/',f*.7);put(c+dx,r+d,'\\',f*.7);put(c-dx,r-d,'\\',f*.7)}
  }
}

/* ---------- loop ---------- */
const t0=performance.now();
function frame(now){
  const t=(now-t0)/1000,rot=t*.36,cy=Math.cos(rot),sy=Math.sin(rot),cx=Math.cos(TILT),sx=Math.sin(TILT);
  g.fillStyle='#000';g.fillRect(0,0,W,H);letters=0;
  Z.fill(-1e9);B.fill(0);K.fill(0);Rf.fill(0);
  const l2x=Math.cos(t*1.7),l2z=Math.sin(t*1.3)+.6,l2l=Math.hypot(l2x,.7,l2z),L2x=l2x/l2l,L2y=.7/l2l,L2z=l2z/l2l;
  const l3x=Math.cos(t*.9+2),l3z=Math.sin(t*1.1+1)+.6,l3l=Math.hypot(l3x,.4,l3z),L3x=l3x/l3l,L3y=.4/l3l,L3z=l3z/l3l;
  const cand=[];

  for(let i=0;i<NP;i++){
    const o=i*7,x=P[o],y=P[o+1],z=P[o+2],k=P[o+6];
    const x1=x*cy+z*sy,z1=-x*sy+z*cy,y2=y*cx-z1*sx,z2=y*sx+z1*cx,s=D/(D-z2);
    const c=(W/2+x1*s*U)/cw|0,r=(H*.47-(y2-.08)*s*U)/ch|0;
    if(c<0||c>=cols||r<0||r>=rows)continue;
    const idx=r*cols+c;if(z2<=Z[idx])continue;
    let v;
    if(k===3){v=.26+.2*Math.sin(i*.7+t*3)}
    else{
      const nx=P[o+3],ny=P[o+4],nz=P[o+5],n1=nx*cy+nz*sy,m1=-nx*sy+nz*cy,n2y=ny*cx-m1*sx,n2z=ny*sx+m1*cx;
      if(n2z<-.15)continue;
      const d=Math.max(0,n1*Lx+n2y*Ly+n2z*Lz);
      if(k===2){
        const s2=Math.pow(Math.max(0,n1*L2x+n2y*L2y+n2z*L2z),14),s3=Math.pow(Math.max(0,n1*L3x+n2y*L3y+n2z*L3z),14);
        v=.28+.35*d+1.1*s2+.8*s3;
        if(v>.95&&Math.random()<.012)cand.push(idx);
      }else{
        const sp=Math.pow(Math.max(0,n1*Hx+n2y*Hy+n2z*Hz),26),rim=Math.pow(1-Math.abs(n2z),3),env=.5+.5*Math.sin(n2y*5+n1*3+t*.8);
        v=.07+.4*d+.75*sp+.3*rim+.16*env*d;
        if(v>.92&&Math.random()<.004)cand.push(idx);
      }
    }
    Z[idx]=z2;B[idx]=v;K[idx]=k+1;
  }

  /* reflection base row */
  const fr=Math.floor((H*.47+1.02*U)/ch);
  for(let r=0;r<=fr&&r<rows;r++)for(let c=0;c<cols;c++){
    const idx=r*cols+c,kk=K[idx];if(!kk||kk===4||B[idx]<.12)continue;
    const rr=fr+1+Math.floor((fr-r)*.5);if(rr>=rows||rr-fr>22)continue;
    const j=rr*cols+c,a=B[idx]*.22*(1-(rr-fr)/24);if(a>Rf[j])Rf[j]=a;
  }

  /* stars */
  for(const s of stars){const a=.1+.25*(.5+.5*Math.sin(t*s[3]+s[2]));put(s[0],s[1],s[4],a)}

  /* draw scene */
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const idx=r*cols+c;
    if(K[idx]){
      const v=Math.max(0,Math.min(1,B[idx]+(Math.random()-.5)*.05)),ci=v*RL|0;
      if(ci>0)put(c,r,RAMP[ci],K[idx]===4?v*1.4:.22+.78*v);
    }else if(Rf[idx]>.03){
      put(c,r,RAMP[Math.min(RL,Rf[idx]*RL*2.2|0)||1],Rf[idx]*1.3);
    }
  }

  /* glints */
  for(let i=0;i<cand.length&&glints.length<30;i+=3){
    const idx=cand[i];glints.push({c:idx%cols,r:idx/cols|0,b:t,life:.35+Math.random()*.5,len:2+Math.random()*4|0});glintTotal++;
  }
  for(let i=glints.length-1;i>=0;i--){
    const q=glints[i],p=(t-q.b)/q.life;if(p>=1){glints.splice(i,1);continue}
    star(q.c,q.r,Math.max(1,q.len*Math.sin(p*Math.PI)|0),1-p*.6,true);
  }
  /* big crown flare */
  {
    const y2=YT*cx,z2=YT*sx,s=D/(D-z2),c=Math.floor(W/2/cw),r=Math.floor((H*.47-(y2-.08)*s*U)/ch);
    const pulse=.5+.5*Math.sin(t*2.6);
    star(c,r-1,7+pulse*6|0,.55+.4*pulse,false);
  }

  /* HUD */
  tl.innerHTML=`<span class="d">●</span> t ${t.toFixed(2).padStart(5,'0')}s`;
  bl.textContent=`ASCII RING  ${new Date().getFullYear()}\nrotation ${(rot*180/Math.PI%360).toFixed(2).padStart(6,'0')}°   glints ${glintTotal.toLocaleString('en-US')}\nletters ${letters.toLocaleString('en-US')}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
